title = "VeilTalk T06 secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

# Historical JWT unit-test fixture. The value is a deterministic repeated test
# pattern, exists only in this test source, and was never a deployable secret.
# Requiring both the exact commit and path prevents this exception from hiding a
# future finding in the same file or elsewhere in the repository.
[[allowlists]]
description = "Deterministic JwtServiceTests fixture introduced with the JWT service"
condition = "AND"
commits = ["16dae68060ef9cbab089c6565bdce02d8969cc5c"]
paths = ["^backend/src/test/java/com/veiltalk/auth/JwtServiceTests\\.java$"]
