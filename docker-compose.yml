services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - internal-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_NOTIFY_WEBHOOK_ENABLE_VEILTALK: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_VEILTALK: "http://backend:8080/internal/videos/webhook"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_VEILTALK: ${MINIO_WEBHOOK_SECRET}
      MINIO_NOTIFY_WEBHOOK_BATCH_SIZE_VEILTALK: "1"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - internal-net

  backend:
    image: veiltalk/backend:latest
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      VIDEO_STORAGE_LIMIT_BYTES: ${VIDEO_STORAGE_LIMIT_BYTES:-2147483648}
      VIDEO_LOCK_TTL_MILLIS: ${VIDEO_LOCK_TTL_MILLIS:-30000}
      VIDEO_LOCK_ACQUIRE_TIMEOUT_MILLIS: ${VIDEO_LOCK_ACQUIRE_TIMEOUT_MILLIS:-5000}
      VIDEO_PROCESSING_TIMEOUT_SECONDS: ${VIDEO_PROCESSING_TIMEOUT_SECONDS:-600}
      VIDEO_CLEANUP_INTERVAL_SECONDS: ${VIDEO_CLEANUP_INTERVAL_SECONDS:-300}
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SIGNALING_JWT_SECRET: ${SIGNALING_JWT_SECRET}
      INTERNAL_CALL_NOTIFY_SECRET: ${INTERNAL_CALL_NOTIFY_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - internal-net

  signaling:
    image: veiltalk/signaling:latest
    build:
      context: ./signaling
    environment:
      PORT: ${PORT}
      SIGNALING_JWT_SECRET: ${SIGNALING_JWT_SECRET}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      INTERNAL_CALL_NOTIFY_SECRET: ${INTERNAL_CALL_NOTIFY_SECRET}
      BACKEND_URL: ${BACKEND_URL}
      CALL_NOTIFY_TIMEOUT_MS: ${CALL_NOTIFY_TIMEOUT_MS:-2500}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - internal-net

  frontend:
    image: veiltalk/frontend:latest
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - signaling
    networks:
      - internal-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - signaling
      - frontend
    networks:
      - internal-net

volumes:
  postgres_data:
  minio_data:

networks:
  internal-net:
    driver: bridge
